name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate release metadata
        env:
          NEAT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_check.py
      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  attach:
    name: Attach release artifacts
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  publish-pypi:
    name: Publish to PyPI
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neat-optim
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
