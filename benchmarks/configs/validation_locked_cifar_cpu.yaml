# Pre-registered CPU validation-locked studies.
# Execute with benchmarks.torch_suite.locked_study; do not change selections
# after the held-out test phase begins.

protocol:
  validation_fraction: 0.10
  split_seed: 20260731
  tuning_seed: 101
  test_seeds: [7, 11, 19, 23, 29]
  selection_metric: validation_top1_accuracy
  final_metric: held_out_test_top1_accuracy

budget:
  learning_rate_trials_per_optimizer: 4
  comparators: [neat, adamw, lion, sgd]

cifar10_resnet18:
  tuning_epochs: 15
  test_epochs: 100
  batch_size: 128
  weight_decay: 5.0e-4
  learning_rates:
    neat: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3]
    adamw: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3]
    lion: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4]
    sgd: [1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1]

cifar100_resnet34:
  tuning_epochs: 12
  test_epochs: 100
  batch_size: 128
  weight_decay: 5.0e-4
  learning_rates:
    neat: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3]
    adamw: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3]
    lion: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4]
    sgd: [1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1]
